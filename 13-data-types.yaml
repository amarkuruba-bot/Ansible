- name: course information 
  hosts: local
  connection: local
  vars:
    course: "AI Ops with DevOps on AWS" #string
    duration_in_hours: 150 #number or intiger
    is_live_session: true #boolean
    topics: #list
    - linux
    - shell
    - terraform
    - Ansible
    more_details: #dictionary/map
      trainer: Sivakumar
      months: 4
    exact_duration_in_months: 4.5 
  tasks:
  - name: print info and type 
    debug:
      msg: |
        name: "{{course}} : {{course | type_debug}}"
    debug:
        msg:
        duration : "{{duration_in_hours}} : {{duration_in_hours | type_debug}}"
    debug:
        msg: |
        is live:  "{{is_live_session}} : {{is_live_session | type_debug}}"
    debug:
        msg: | 
        topics are: "{{topics}} : {{topics | type_debug}}"
    debug:
        msg: |  
        more details: "{{more_details}} : {{more_details | type_debug}}"
    debug:
        msg:  |  
        duration: "{{exact_duration_in_months}} : {{exact_duration_in_months | type_debug}}" 
