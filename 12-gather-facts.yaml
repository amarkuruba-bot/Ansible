- name: print facts
  hosts: local
  connection: local
  tasks:
  - name: print the facts
    debug:
      msg: "{{ansible_facts}}"


  - name: print some info from facts
    debug:
      msg: |
        OS Family: {{ansible_facts['os_family']}}
        # private: {{ansible_facts.default_ipv4.address}}
        private: {{ansible_facts['default_ipv4']['address']}}

